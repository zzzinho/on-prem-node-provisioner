# Rules mirror config/rbac/role.yaml verbatim — the least privilege the
# controller needs: watch Pods and Nodes, cordon Nodes and evict Pods to drain,
# reconcile Machines/NodePools and their status, emit Events. The wol-agent has
# NO ClusterRole/binding: it never touches the k8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "onp.fullname" . }}-controller
  labels:
    {{- include "onp.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - onp.io
  resources:
  - machines
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - onp.io
  resources:
  - machines/status
  - nodepools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - onp.io
  resources:
  - nodepools
  verbs:
  - get
  - list
  - watch
